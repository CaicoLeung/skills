name: validate-skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate skill frontmatter (ADR-0002)
        run: python3 scripts/validate-skills.py
      - name: Check branch-protection drift guard (ADR-0003)
        # The default GITHUB_TOKEN cannot read branch protection (the
        # `administration` scope is not grantable via the `permissions:` block),
        # so this degrades to a graceful skip in CI — a visible, dedicated home
        # for the gate that enforces when run with a token that has admin read.
        run: python3 scripts/branch_protection.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check skills index is up to date
        run: python3 scripts/index-skills.py --check
      - name: Check marketplace is up to date
        run: python3 scripts/build-marketplace.py --check
      - name: Run marketplace generator tests
        run: python3 scripts/test_marketplace.py
      - name: Run skill frontmatter interview-flag tests (ADR-0009)
        run: python3 scripts/test_skills.py
      - name: Run routing dispatcher tests (ADR-0008)
        run: python3 scripts/test_routing.py
      - name: Run independent-reviewer tests (ADR-0007)
        run: python3 scripts/test_reviewer.py
      - name: Run loop driver turn-planning tests (ADR-0008 / T5a)
        run: python3 scripts/test_loop.py
      - name: Run review-verdict selection tests (ADR-0007 enforcement)
        run: python3 scripts/test_review_verdict.py
      - name: Run close-out loop planner tests (ADR-0008 §5 / T5b)
        run: python3 scripts/test_closeout.py
      - name: Run branch-protection drift-guard tests (ADR-0003)
        run: python3 scripts/test_branch_protection.py
      - name: Run supervisor planner tests (ADR-0006 §T1 / issue #11)
        run: python3 scripts/test_supervise.py
