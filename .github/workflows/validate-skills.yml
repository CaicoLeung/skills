name: validate-skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate skill frontmatter (ADR-0002)
        run: python3 scripts/validate-skills.py
      - name: Check skills index is up to date
        run: python3 scripts/index-skills.py --check
      - name: Run routing dispatcher tests (ADR-0008)
        run: python3 scripts/test_routing.py
      - name: Run independent-reviewer tests (ADR-0007)
        run: python3 scripts/test_reviewer.py
      - name: Run loop driver turn-planning tests (ADR-0008 / T5a)
        run: python3 scripts/test_loop.py
      - name: Run review-verdict selection tests (ADR-0007 enforcement)
        run: python3 scripts/test_review_verdict.py
      - name: Run close-out loop planner tests (ADR-0008 §5 / T5b)
        run: python3 scripts/test_closeout.py
      - name: Run close-out planner tests (ADR-0008 §5 / T5b)
        run: python3 scripts/test_closeout.py
